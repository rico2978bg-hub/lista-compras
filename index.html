<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16a34a">
<title>Lista de compras</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ec; --card: #ffffff; --text: #1b2620; --muted: #6f7a73; --line: #ebe6da;
    --green: #16a34a; --green-2: #22c55e; --teal: #0f766e; --soft: #e8f6ee; --warn: #c2410c; --warn-soft: #fff1e6;
    --danger: #dc2626; --shadow: 0 1px 2px rgba(27, 38, 32, .04), 0 8px 24px rgba(27, 38, 32, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1411; --card: #161e1a; --text: #e9f0ec; --muted: #93a19a; --line: #24302a;
            --soft: #173326; --warn: #fb923c; --warn-soft: #3a2414; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); font: 16px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 400px at 100% -10%, #22c55e22, transparent 60%),
      radial-gradient(700px 400px at -10% 30%, #f59e0b1a, transparent 60%),
      var(--bg);
    min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }

  /* Cabeçalho */
  .hero {
    position: relative; overflow: hidden; color: #fff; border-radius: 28px; padding: 24px;
    background: linear-gradient(135deg, var(--green-2), var(--green) 45%, var(--teal));
    box-shadow: 0 14px 34px -12px #16a34a99;
  }
  .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: #ffffff1f; }
  .hero::before { width: 220px; height: 220px; right: -70px; top: -90px; }
  .hero::after { width: 120px; height: 120px; right: 60px; bottom: -70px; }
  .hero-top { position: relative; display: flex; align-items: center; gap: 14px; }
  .logo { display: grid; place-items: center; width: 56px; height: 56px; font-size: 30px; border-radius: 18px;
          background: #ffffff2e; backdrop-filter: blur(6px); }
  h1 { margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  #contagem { margin: 4px 0 0; opacity: .9; font-weight: 500; }
  .progresso { position: relative; height: 10px; margin-top: 20px; border-radius: 99px; background: #00000026; overflow: hidden; }
  .progresso span { display: block; height: 100%; width: 0; border-radius: inherit; background: #fff; transition: width .5s cubic-bezier(.2, .8, .2, 1); }

  /* Adicionar */
  .add { display: flex; gap: 8px; margin: -22px 12px 0; position: relative; padding: 8px; border-radius: 20px;
         background: var(--card); box-shadow: var(--shadow); }
  .add input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: inherit; font: inherit; padding: 10px 12px; }
  .add button { flex: none; width: 48px; height: 48px; border: 0; border-radius: 14px; cursor: pointer; color: #fff; font-size: 1.6rem; line-height: 1;
                background: linear-gradient(135deg, var(--green-2), var(--green)); box-shadow: 0 6px 14px -6px #16a34a; transition: transform .15s; }
  .add button:hover { transform: rotate(90deg) scale(1.05); }
  .add:focus-within { box-shadow: var(--shadow), 0 0 0 3px #22c55e55; }
  #msg { margin: 10px 16px 0; color: var(--danger); font-size: .9rem; font-weight: 600; }
  #msg:empty { display: none; }

  /* Itens */
  #lista { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 8px; }
  #lista li { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 18px;
              background: var(--card); box-shadow: var(--shadow); transition: opacity .2s; }
  #lista li.anima { animation: entra .35s cubic-bezier(.2, .8, .2, 1.2); }
  @keyframes entra { from { transform: translateY(-6px) scale(.97); opacity: 0; } }
  #lista label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .check { appearance: none; flex: none; width: 26px; height: 26px; margin: 0; border: 2px solid var(--line); border-radius: 50%;
           display: grid; place-items: center; cursor: pointer; transition: background .2s, border-color .2s; }
  .check::after { content: "✓"; color: #fff; font-size: 15px; font-weight: 800; transform: scale(0); transition: transform .2s cubic-bezier(.2, .8, .2, 1.4); }
  .check:checked { background: var(--green); border-color: var(--green); }
  .check:checked::after { transform: scale(1); }
  .check:focus-visible { outline: 3px solid #22c55e66; outline-offset: 2px; }
  .emoji { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--soft); font-size: 22px; }
  .nome { font-weight: 600; overflow-wrap: anywhere; }
  #lista li.comprado { opacity: .55; }
  #lista li.comprado .nome { text-decoration: line-through; text-decoration-thickness: 2px; }
  .remover { flex: none; width: 36px; height: 36px; border: 0; border-radius: 12px; background: none; color: var(--muted);
             font-size: 1.4rem; line-height: 1; cursor: pointer; transition: background .15s, color .15s; }
  .remover:hover, .remover:focus-visible { background: #dc26261a; color: var(--danger); }
  #lista li.vazio { flex-direction: column; gap: 4px; padding: 28px 16px; text-align: center; color: var(--muted); }
  .vazio .grande { font-size: 44px; }

  /* Seções */
  section { margin-top: 32px; }
  h2 { display: flex; align-items: center; gap: 8px; margin: 0 4px 12px; font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; }
  .dica-vazia { margin: 0 4px; color: var(--muted); font-size: .95rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 99px;
          background: var(--card); color: inherit; font: inherit; font-weight: 600; cursor: pointer; box-shadow: var(--shadow);
          transition: transform .15s, border-color .15s; }
  .chip:hover { transform: translateY(-2px); border-color: var(--green-2); }
  .chip small { color: var(--muted); font-weight: 500; }

  .pratos { display: grid; gap: 10px; }
  .prato { display: flex; gap: 14px; padding: 16px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); }
  .prato-emoji { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; font-size: 28px;
                 background: linear-gradient(135deg, #fef3c7, #fde68a); }
  .prato-info { flex: 1; min-width: 0; }
  .prato strong { display: block; font-weight: 700; }
  .medidor { height: 6px; margin: 8px 0 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .medidor span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green-2), var(--green)); }
  .prato small { color: var(--muted); }
  .faltam { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .faltam button { padding: 4px 10px; border: 0; border-radius: 99px; background: var(--warn-soft); color: var(--warn);
                   font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
  .faltam button:hover { filter: brightness(.95); }

  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: .85rem; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="hero-top">
      <span class="logo" aria-hidden="true">🛒</span>
      <div>
        <h1>Lista de compras</h1>
        <p id="contagem"></p>
      </div>
    </div>
    <div class="progresso" aria-hidden="true"><span id="progresso"></span></div>
  </header>

  <form id="form" class="add">
    <input id="novo" type="text" placeholder="O que falta em casa?" maxlength="60" aria-label="Novo item" autocomplete="off">
    <button aria-label="Adicionar">+</button>
  </form>
  <p id="msg" role="status"></p>

  <ul id="lista"></ul>

  <section>
    <h2>✨ Sugestões do histórico</h2>
    <div id="sugestoes" class="chips"></div>
  </section>

  <section>
    <h2>🍳 Dá para cozinhar</h2>
    <div id="cardapio" class="pratos"></div>
  </section>

  <footer>Seus dados ficam só neste navegador.</footer>
</main>

<script>
const CHAVE_LISTA = "compras_lista";
const CHAVE_HIST = "compras_historico";

// Dados corrompidos no localStorage não podem travar o app.
function ler(chave, padrao) {
  try { return JSON.parse(localStorage.getItem(chave)) ?? padrao; } catch { return padrao; }
}
const ehObjeto = v => v !== null && typeof v === "object" && !Array.isArray(v);

let itens = ler(CHAVE_LISTA, []);
if (!Array.isArray(itens)) itens = [];
itens = itens.filter(i => i && typeof i.nome === "string");
let historico = ler(CHAVE_HIST, {}); // { "arroz": 3, ... } chave sempre normalizada
if (!ehObjeto(historico)) historico = {};

const limpar = s => String(s).trim().replace(/\s+/g, " ");
const norm = s => limpar(s).toLowerCase();
const capitalizar = s => s.charAt(0).toUpperCase() + s.slice(1);
const semAcento = s => norm(s).normalize("NFD").replace(/\p{M}/gu, "");
const msg = document.getElementById("msg");
let destaque = null; // item que acabou de entrar, para animar só ele

// Emoji pelo nome do item. Os mais específicos vêm antes (ex.: macarrão antes de maçã).
const EMOJIS = [
  ["macarrao", "🍝"], ["arroz", "🍚"], ["feijao", "🫘"], ["frango", "🍗"], ["ovo", "🥚"], ["leite", "🥛"], ["iogurte", "🥛"],
  ["pao", "🍞"], ["cafe", "☕"], ["tomate", "🍅"], ["carne", "🥩"], ["bife", "🥩"], ["linguica", "🌭"], ["salsicha", "🌭"],
  ["peixe", "🐟"], ["queijo", "🧀"], ["presunto", "🥓"], ["manteiga", "🧈"], ["banana", "🍌"], ["maca", "🍎"], ["uva", "🍇"],
  ["laranja", "🍊"], ["limao", "🍋"], ["melancia", "🍉"], ["morango", "🍓"], ["abacaxi", "🍍"], ["batata", "🥔"],
  ["cenoura", "🥕"], ["alface", "🥬"], ["couve", "🥬"], ["cebola", "🧅"], ["alho", "🧄"], ["milho", "🌽"], ["cuscuz", "🌽"],
  ["farinha", "🌾"], ["acucar", "🍬"], ["sal", "🧂"], ["oleo", "🫒"], ["azeite", "🫒"], ["suco", "🧃"], ["agua", "💧"],
  ["cerveja", "🍺"], ["refrigerante", "🥤"], ["chocolate", "🍫"], ["biscoito", "🍪"], ["bolacha", "🍪"], ["sabao", "🧼"],
  ["sabonete", "🧼"], ["detergente", "🧴"], ["shampoo", "🧴"], ["papel", "🧻"], ["pizza", "🍕"], ["creme de leite", "🥛"],
];
const emoji = nome => (EMOJIS.find(([k]) => semAcento(nome).includes(k)) || [, "🛍️"])[1];

function salvar() {
  try {
    localStorage.setItem(CHAVE_LISTA, JSON.stringify(itens));
    localStorage.setItem(CHAVE_HIST, JSON.stringify(historico));
  } catch {
    msg.textContent = "Não consegui salvar no navegador (armazenamento cheio ou bloqueado).";
  }
}

function adicionar(texto) {
  const nome = capitalizar(limpar(texto));
  if (!nome) return "Digite um item.";
  if (itens.some(i => norm(i.nome) === norm(nome))) return `"${nome}" já está na lista.`;
  destaque = { nome, comprado: false };
  itens.push(destaque);
  salvar(); render();
  return "";
}

function marcar(item, comprado) {
  if (!itens.includes(item) || item.comprado === comprado) return;
  item.comprado = comprado;
  // Desmarcar desfaz a compra, senão marcar/desmarcar repetido infla o histórico.
  const k = norm(item.nome);
  historico[k] = (historico[k] || 0) + (comprado ? 1 : -1);
  if (historico[k] <= 0) delete historico[k];
  salvar(); render();
}

function remover(item) {
  itens = itens.filter(i => i !== item);
  salvar(); render();
}

function sugestoes() {
  const naLista = new Set(itens.map(i => norm(i.nome)));
  return Object.entries(historico)
    .filter(([k]) => !naLista.has(k))
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8)
    .map(([k, vezes]) => ({ nome: capitalizar(k), vezes }));
}

// Cardápio sem IA: pratos simples, ranqueados por quantos ingredientes já estão na lista.
const RECEITAS = [
  ["Arroz, feijão e bife", "🍛", ["arroz", "feijão", "carne"]],
  ["Frango grelhado com salada", "🥗", ["frango", "alface", "tomate"]],
  ["Macarrão à bolonhesa", "🍝", ["macarrão", "carne", "tomate", "cebola"]],
  ["Omelete de legumes", "🍳", ["ovo", "tomate", "cebola"]],
  ["Strogonoff de frango", "🍲", ["frango", "creme de leite", "arroz"]],
  ["Sopa de legumes", "🥣", ["batata", "cenoura", "cebola"]],
  ["Peixe assado com batatas", "🐟", ["peixe", "batata"]],
  ["Feijoada simples", "🫘", ["feijão", "linguiça", "arroz"]],
  ["Panqueca de carne", "🥞", ["farinha", "leite", "ovo", "carne"]],
  ["Escondidinho de carne", "🥘", ["batata", "carne", "queijo"]],
  ["Sanduíche natural", "🥪", ["pão", "frango", "alface"]],
  ["Cuscuz com ovo", "🌽", ["cuscuz", "ovo"]],
];

function cardapio() {
  const naLista = itens.map(i => semAcento(i.nome));
  return RECEITAS
    .map(([prato, icone, ingr]) => {
      const tem = ingr.filter(x => naLista.some(n => n.includes(semAcento(x))));
      return { prato, icone, total: ingr.length, tem, falta: ingr.filter(x => !tem.includes(x)) };
    })
    .filter(r => r.tem.length)
    .sort((a, b) => b.tem.length - a.tem.length || a.falta.length - b.falta.length)
    .slice(0, 3);
}

const el = (tag, props = {}, ...filhos) => { const e = Object.assign(document.createElement(tag), props); e.append(...filhos); return e; };

function render() {
  const total = itens.length;
  const comprados = itens.filter(i => i.comprado).length;
  document.getElementById("contagem").textContent =
    !total ? "Sua lista está vazia" :
    comprados === total ? "🎉 Tudo comprado!" :
    `${total - comprados} para comprar · ${comprados} no carrinho`;
  document.getElementById("progresso").style.width = total ? (comprados / total * 100) + "%" : "0";

  const ul = document.getElementById("lista");
  ul.replaceChildren();
  if (!total) {
    ul.append(el("li", { className: "vazio" },
      el("span", { className: "grande", textContent: "🧺" }),
      el("strong", { textContent: "Nada por aqui ainda" }),
      el("span", { textContent: "Adicione o primeiro item lá em cima." })));
  }
  // Pendentes primeiro, comprados no fim (sort é estável: mantém a ordem de inclusão).
  for (const item of [...itens].sort((a, b) => a.comprado - b.comprado)) {
    const cb = el("input", { type: "checkbox", className: "check", checked: item.comprado });
    cb.addEventListener("change", () => marcar(item, cb.checked));
    const x = el("button", { className: "remover", textContent: "×" });
    x.setAttribute("aria-label", `Remover ${item.nome}`);
    x.addEventListener("click", () => remover(item));
    ul.append(el("li", { className: (item.comprado ? "comprado " : "") + (item === destaque ? "anima" : "") },
      el("label", {}, cb, el("span", { className: "emoji", textContent: emoji(item.nome) }), el("span", { className: "nome", textContent: item.nome })),
      x));
  }
  destaque = null;

  const box = document.getElementById("sugestoes");
  box.replaceChildren();
  const lista = sugestoes();
  if (!lista.length) box.append(el("p", { className: "dica-vazia", textContent: "Marque itens como comprados e eles aparecem aqui da próxima vez." }));
  for (const s of lista) {
    const b = el("button", { className: "chip" }, `${emoji(s.nome)} ${s.nome}`, el("small", { textContent: `${s.vezes}×` }));
    b.addEventListener("click", () => { msg.textContent = adicionar(s.nome); });
    box.append(b);
  }

  renderCardapio();
}

function renderCardapio() {
  const box = document.getElementById("cardapio");
  box.replaceChildren();
  const pratos = cardapio();
  if (!pratos.length) {
    box.append(el("p", { className: "dica-vazia", textContent: "Adicione itens como arroz, feijão, frango ou ovos para ver ideias de pratos." }));
    return;
  }
  for (const r of pratos) {
    const medidor = el("div", { className: "medidor" }, el("span"));
    medidor.firstChild.style.width = (r.tem.length / r.total * 100) + "%";
    const info = el("div", { className: "prato-info" },
      el("strong", { textContent: r.prato }), medidor,
      el("small", { textContent: r.falta.length ? `Você tem ${r.tem.length} de ${r.total} ingredientes` : "Você tem tudo! 🙌" }));
    if (r.falta.length) {
      const faltam = el("div", { className: "faltam" });
      for (const f of r.falta) {
        const b = el("button", { textContent: `+ ${f}` });
        b.title = `Adicionar ${f} à lista`;
        b.addEventListener("click", () => { msg.textContent = adicionar(f); });
        faltam.append(b);
      }
      info.append(faltam);
    }
    box.append(el("div", { className: "prato" }, el("span", { className: "prato-emoji", textContent: r.icone }), info));
  }
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const campo = document.getElementById("novo");
  msg.textContent = adicionar(campo.value);
  if (!msg.textContent) campo.value = "";
  campo.focus();
});

render();
</script>
</body>
</html>
